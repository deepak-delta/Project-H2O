<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Water Delivery</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f6f7f9; color: #0f172a; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #475569; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 12px; background: #0b5f73; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>No internet connection</h1>
      <p>Water Delivery needs the internet the first time it opens. After that it works offline too.</p>
      <a id="retry" href="#">Try again</a>
    </main>
    <script src="app-url.js"></script>
    <script>
      document.getElementById('retry').addEventListener('click', function (e) {
        e.preventDefault();
        location.href = window.APP_URL || '/';
      });
    </script>
  </body>
</html>
